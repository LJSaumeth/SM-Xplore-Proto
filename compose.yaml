# Levanta la app + MongoDB + PostgreSQL para probar la API desde Swagger
# (http://localhost:8080/swagger-ui.html) o desde un cliente frontend.
#
# Uso:
#   docker compose up --build        # construye la imagen y levanta todo
#   docker compose up mongodb -d     # solo MongoDB (p. ej. para correr la app desde el IDE)
#   docker compose up postgres -d    # solo PostgreSQL
#   docker compose logs -f app       # ver logs de la app
#   docker compose down              # detiene todo (usa -v para borrar también los datos)
services:
  mongodb:
    image: mongo:latest
    container_name: ahorasi-mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: ahorasi-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ahorasi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ahorasi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahorasi-app
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # application-docker.yaml apunta a las bases de datos del compose y ajusta
      # el perfil de pruebas
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB:-ahorasi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  mongodb_data:
  postgres_data:
