spring:
  application:
    name: ahorasi
  r2dbc:
    # el puerto 5432 es el default del servicio "postgres" de compose
    # (si lo cambias con POSTGRES_PORT, ajusta también R2DBC_URL para que coincidan)
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/ahorasi}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  sql:
    init:
      # schema.sql es idempotente; en producción conviene migrarlo a una
      # herramienta de migraciones versionadas
      mode: always
      schema-locations: classpath:schema.sql
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ahorasi}
    representation:
      uuid: standard
  data:
    mongodb:
      # Indexes are ensured explicitly by MongoIndexInitializer at startup
      auto-index-creation: false
      representation:
        big-decimal: decimal128

app:
  security:
    jwt:
      # Secreto HMAC para firmar los JWT (mínimo 32 bytes) — usa uno fuerte por entorno
      secret: ${JWT_SECRET:dev-secret-change-me-32-bytes-minimum!}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    cors:
      # Orígenes permitidos para el front (patterns separados por coma)
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
    bootstrap-admin:
      # Opcional: si se definen, crea el primer ADMIN al arrancar (idempotente por email)
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
