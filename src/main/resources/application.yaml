spring:
  application:
    name: ahorasi
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/ahorasi}
    username: ${R2DBC_USERNAME:postgres}
    password: ${R2DBC_PASSWORD:postgres}
  sql:
    init:
      # The events/activities schema is created explicitly at startup (idempotent script)
      mode: always
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ahorasi}
    representation:
      uuid: standard
  data:
    mongodb:
      # Indexes are ensured explicitly by MongoIndexInitializer at startup
      auto-index-creation: false
      representation:
        big-decimal: decimal128
