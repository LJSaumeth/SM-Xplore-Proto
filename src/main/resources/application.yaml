spring:
  application:
    name: ahorasi
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/ahorasi}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  sql:
    init:
      mode: always
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ahorasi}
    representation:
      uuid: standard
  data:
    mongodb:
      # Indexes are ensured explicitly by MongoIndexInitializer at startup
      auto-index-creation: false
      representation:
        big-decimal: decimal128
  r2dbc:
    # el puerto 5433 es el que publica el servicio "postgres" de compose
    # (ajústalo con R2DBC_URL si usas otra base de datos)
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5433/ahorasi}
    username: ${POSTGRES_USER:ahorasi}
    password: ${POSTGRES_PASSWORD:ahorasi}
  sql:
    init:
      # schema.sql es idempotente; en producción conviene migrarlo a una
      # herramienta de migraciones versionadas
      mode: always
      schema-locations: classpath:schema.sql
