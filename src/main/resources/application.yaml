spring:
  application:
    name: ahorasi
  r2dbc:
    # el puerto 5432 es el default del servicio "postgres" de compose
    # (si lo cambias con POSTGRES_PORT, ajusta también R2DBC_URL para que coincidan)
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/ahorasi}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  sql:
    init:
      # schema.sql es idempotente; en producción conviene migrarlo a una
      # herramienta de migraciones versionadas
      mode: always
      schema-locations: classpath:schema.sql
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ahorasi}
    representation:
      uuid: standard
  data:
    mongodb:
      # Indexes are ensured explicitly by MongoIndexInitializer at startup
      auto-index-creation: false
      representation:
        big-decimal: decimal128
